<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Conversor de Moedas</h1>

            <form class="converter">
                <label class="field">
                    <span>Valor</span>
                    <input type="number" value="100" min="0" step="0.01" placeholder="Digite o valor">
                </label>

                <div class="row">
                    <label class="field">
                        <span>De</span>
                        <select>
                            <option>BRL</option>
                            <option>USD</option>
                            <option>EUR</option>
                            <option>GBP</option>
                        </select>
                    </label>

                    <label class="field">
                        <span>Para</span>
                        <select>
                            <option>USD</option>
                            <option>BRL</option>
                            <option>EUR</option>
                            <option>GBP</option>
                        </select>
                    </label>
                </div>

                <button id="btn-converter" name="btn-converter">Converter</button>
            </form>

            <div class="result-box">
                <h2>Resultado:</h2>
                <p id="resultado">0</p> 
            </div>
        </section>
    </main>
    
    <!-- Script para importar o arquivo -->
    <script type="module" src="assets/js/app.js"></script>
   
  
</body>
</html>
